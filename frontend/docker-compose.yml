# Base PostgreSQL de développement pour MonMentor.
# Port 5442 sur la machine (le 5432 est souvent déjà utilisé par d'autres projets).
services:
  postgres:
    image: postgres:17
    container_name: lirel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lirel
      POSTGRES_PASSWORD: lirel
      POSTGRES_DB: lirel
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - lirel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lirel -d lirel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lirel-pgdata:
